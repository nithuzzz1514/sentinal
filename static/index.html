<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentinel</title>
<style>
:root{--bg:#eef1f7;--cd:#fff;--tx:#0e1530;--mu:#5d6785;--bd:#dde2ee;--ac:#4f46e5;--hi:#e11d48;--md:#f59e0b;--lo:#0d9488;--hd:#0e1530}
@media(prefers-color-scheme:dark){:root{--bg:#0a0f22;--cd:#121a35;--tx:#e8ecfa;--mu:#93a0c4;--bd:#243055;--hd:#050816}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}
header{background:var(--hd);color:#fff;padding:12px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.brand{font-weight:800;font-size:19px}.brand i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--hi);margin-right:8px;animation:p 2s infinite}@keyframes p{50%{box-shadow:0 0 0 8px #e11d4800;box-shadow:0 0 0 8px #e11d4830}}
nav{flex:1;display:flex;gap:4px}button{font:inherit;cursor:pointer}nav button,.b{border:1px solid var(--bd);background:transparent;color:inherit;padding:6px 12px;border-radius:8px}nav button{color:#b6c0e4;border-color:transparent}nav button.on{background:#ffffff1c;color:#fff}
.b.p{background:var(--ac);color:#fff;border-color:var(--ac)}.b.d{background:var(--hi);color:#fff;border-color:var(--hi)}.b:disabled{opacity:.4}
main{padding:20px;max-width:1280px;margin:auto}.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;min-width:0}h2{font-size:15px;margin:0 0 10px}.mu{color:var(--mu)}.big{font-size:30px;font-weight:800}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}.split{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px}@media(max-width:820px){.split{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;padding:9px;border-radius:10px;cursor:pointer;border:1px solid transparent}.row:hover,.row.on{background:var(--bg);border-color:var(--bd)}.sc{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-size:13px}.bar .t{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.bar b{display:block;height:100%;background:var(--ac)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);font-size:13px;white-space:nowrap}tr.t{cursor:pointer}tr.t:hover,tr.on{background:var(--bg)}.sx{overflow-x:auto}textarea,input,select{font:inherit;background:var(--bg);color:inherit;border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
.login{max-width:380px;margin:12vh auto;padding:0 16px}.login h1{margin:0 0 4px;font-size:30px}.login input{margin:6px 0}.err{color:var(--hi)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.chips .b{padding:2px 10px;font-size:12px}.chips .on{background:var(--ac);color:#fff}
</style></head><body><div id="app"></div><script>
let ME=null,TAB='ov',SEL=null,SELTX=0,FLT='All',D={},CS=[];const $=i=>document.getElementById(i);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN'),rc=s=>s>=80?'var(--hi)':s>=60?'var(--md)':'var(--lo)',fd=t=>new Date(t*1000).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const STC={Open:'var(--ac)',Escalated:'var(--hi)',Closed:'#64748b','SAR filed':'#7c3aed'};
async function api(p,body){const r=await fetch('/api/'+p,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(ME?ME.token:'')},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function loginView(err){$('app').innerHTML=`<div class="login"><div class="brand" style="font-size:22px"><i></i>Sentinel</div><h1>Sign in</h1><p class="mu">Demo users: priya / arun (analyst), rajesh (supervisor), kavya (auditor). Password: demo123</p><input id="u" placeholder="Username" value="rajesh"><input id="p" type="password" placeholder="Password" value="demo123"><div class="err">${err||''}</div><button class="b p" style="width:100%;margin-top:8px" onclick="login()">Sign in</button></div>`}
async function login(){try{ME=await api('login',{user:$('u').value,password:$('p').value});shell();poll();setInterval(poll,3000)}catch(e){loginView(e.message)}}
function shell(){$('app').innerHTML=`<header><div class="brand"><i></i>Sentinel</div><nav><button id="n-ov" onclick="tab('ov')">Overview</button><button id="n-cs" onclick="tab('cs')">Cases</button><button id="n-au" onclick="tab('au')">Audit trail</button></nav>${ME.can.includes('close')?'<button class="b" id="lv" style="color:#fff" onclick="live()"></button>':''}<span>${ME.name} (${ME.role})</span><button class="b" style="color:#fff" onclick="location.reload()">Sign out</button></header><main><div id="ov"></div><div id="cs" style="display:none"><div class="split"><div class="c" id="ql"></div><div id="dt"><div class="c mu">Select a case to investigate.</div></div></div></div><div id="au" style="display:none"></div></main>`;tab('ov')}
function tab(t){TAB=t;['ov','cs','au'].forEach(k=>{$(k).style.display=k==t?'':'none';$('n-'+k).className=k==t?'on':''});if(t=='au')audit()}
async function live(){await api('sim',{on:!D.live});poll()}
function bars(a,f){const m=Math.max(...a.map(x=>x.pts),1);return a.map(x=>`<div class="bar"><span>${x.label}</span><div class="t"><b style="width:${x.pts/m*100}%"></b></div><span>+${x.pts}</span></div>`).join('')||'<span class="mu">No risk factors raised.</span>'}
async function poll(){try{D=await api('summary');CS=await api('cases');const m=D.metrics,h=D.hist,hm=Math.max(...h);
if($('lv'))$('lv').textContent=D.live?'● Live feed on':'Start live feed';
$('ov').innerHTML=`<div class="g"><div class="c"><div class="mu">Transactions monitored</div><div class="big">${D.monitored.toLocaleString('en-IN')}</div></div><div class="c"><div class="mu">Anomalies flagged</div><div class="big" style="color:var(--hi)">${D.flagged}</div></div><div class="c"><div class="mu">Active cases</div><div class="big">${D.active}</div></div><div class="c"><div class="mu">Funds under review</div><div class="big">${inr(D.exposure)}</div></div></div>
<div class="g g2" style="margin-top:16px"><div class="c"><h2>Risk score distribution</h2><svg viewBox="0 0 300 120" width="100%">${h.map((v,i)=>`<rect x="${i*30+3}" y="${100-v/hm*92}" width="24" height="${v/hm*92}" rx="4" fill="${rc(i*10+5)}"/><text x="${i*30+15}" y="114" font-size="9" text-anchor="middle" fill="var(--mu)">${i*10}</text>`).join('')}</svg><div class="mu">Model check on labelled history: AUC ${m.auc}, precision ${m.precision}, recall ${m.recall}.</div></div><div class="c"><h2>What drives alerts overall</h2>${bars(D.drivers)}</div></div>
<div class="c" style="margin-top:16px"><h2>Latest high-risk alerts</h2>${D.latest.map(t=>`<div class="row" onclick="${t.case?`openCase('${t.case}')`:''}"><div class="sc" style="background:${rc(t.risk)}">${t.risk}</div><div style="flex:1"><b>${t.name}</b> · ${inr(t.amount)}<div class="mu">${t.why.join(', ')}</div></div><span class="pill" style="background:var(--ac)">${t.case||''}</span></div>`).join('')}</div>`;
queue();if(SEL&&document.activeElement.id!='note')detail()}catch(e){}}
function queue(){const l=CS.filter(c=>FLT=='All'||c.status==FLT);$('ql').innerHTML=`<h2>Priority queue</h2><div class="chips">${['All','Open','Escalated','SAR filed','Closed'].map(f=>`<button class="b ${FLT==f?'on':''}" onclick="FLT='${f}';queue()">${f}</button>`).join('')}</div>`+(l.map(c=>`<div class="row ${c.id==SEL?'on':''}" onclick="openCase('${c.id}')"><div class="sc" style="background:${rc(c.priority)}">${c.priority}</div><div style="flex:1;min-width:0"><b>${c.name}</b> <span class="mu">${c.id}</span><div class="mu">${c.typology} · ${c.alerts} alert${c.alerts>1?'s':''}</div></div><span class="pill" style="background:${STC[c.status]}">${c.status}</span></div>`).join('')||'<span class="mu">No cases match this filter.</span>')}
function openCase(id){SEL=id;SELTX=0;tab('cs');detail();queue()}
async function detail(){try{const c=await api('cases/'+SEL),t=c.txns[Math.min(SELTX,c.txns.length-1)],a=c.activity,t0=a[0].ts,t1=a[a.length-1].ts,lm=Math.max(...a.map(x=>Math.log(x.amount))),ln=Math.min(...a.map(x=>Math.log(x.amount))),done=['Closed','SAR filed'].includes(c.status),can=k=>ME.can.includes(k);
$('dt').innerHTML=`<div class="g" style="grid-template-columns:1fr"><div class="c"><h2 style="font-size:19px;margin:0">${c.name} <span class="mu">${c.acc}</span></h2><div class="mu">${c.typology} · Assigned to ${can('assign')?`<select style="width:auto" onchange="act('assign',this.value)">${['Priya','Arun'].map(n=>`<option ${n==c.assignee?'selected':''}>${n}</option>`).join('')}</select>`:c.assignee}</div><div><span class="pill" style="background:${STC[c.status]}">${c.status}</span> Priority ${c.priority} · ${done?'Resolved':c.sla_hours<0?`<b style="color:var(--hi)">SLA overdue by ${-c.sla_hours}h</b>`:'SLA due in '+c.sla_hours+'h'}</div></div>
<div class="c"><h2>Why this ${inr(t.amount)} transaction scored ${t.risk}</h2><div class="mu">Points each factor added to the risk score (occlusion attribution plus compliance rules).</div>${bars(t.drivers)}</div>
<div class="c"><h2>Account activity</h2><svg viewBox="0 0 400 110" width="100%">${a.map(x=>{const f=c.flagged_ts.includes(x.ts);return`<circle cx="${12+(x.ts-t0)/((t1-t0)||1)*376}" cy="${100-(Math.log(x.amount)-ln)/((lm-ln)||1)*88}" r="${f?6:3.5}" fill="${f?'var(--hi)':'var(--mu)'}" opacity="${f?.95:.5}"/>`}).join('')}</svg></div>
<div class="c sx"><h2>Flagged transactions</h2><table><tr><th>When</th><th>Amount</th><th>Beneficiary</th><th>Country</th><th>Risk</th></tr>${c.txns.map((x,i)=>`<tr class="t ${i==SELTX?'on':''}" onclick="SELTX=${i};detail()"><td>${fd(x.ts)}</td><td>${inr(x.amount)}</td><td>${x.bene}</td><td>${x.cc}</td><td><span class="pill" style="background:${rc(x.risk)}">${x.risk}</span></td></tr>`).join('')}</table></div>
<div class="c"><h2>Investigation</h2>${ME.role=='auditor'?'<span class="mu">Auditors have read-only access.</span>':`<textarea id="note" rows="2" placeholder="Add an investigation note"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="b p" onclick="act('note',$('note').value)" ${done?'disabled':''}>Save note</button><button class="b" onclick="act('escalate')" ${done||c.status=='Escalated'?'disabled':''}>Escalate</button>${can('close')?`<button class="b" onclick="act('close')" ${done?'disabled':''}>Close as false positive</button><button class="b d" onclick="act('sar')" ${done?'disabled':''}>File SAR</button>`:'<span class="mu">Closing and SAR filing need supervisor access.</span>'}</div>`}${c.notes.map(n=>`<div style="margin-top:10px"><b>${n.who}</b> <span class="mu">${fd(n.ts)}</span><div>${n.text}</div></div>`).join('')}</div></div>`}catch(e){$('dt').innerHTML=`<div class="c err">${e.message}</div>`}}
async function act(a,v){try{await api('cases/'+SEL+'/action',{action:a,value:v});await poll();detail()}catch(e){alert(e.message)}}
async function audit(){try{const l=await api('audit');$('au').innerHTML=`<div class="c sx"><h2>Audit trail</h2><table><tr><th>Time</th><th>Actor</th><th>Role</th><th>Case</th><th>Event</th></tr>${l.map(e=>`<tr><td>${fd(e.ts)}</td><td>${e.who}</td><td>${e.role}</td><td>${e.case||'-'}</td><td style="white-space:normal">${e.msg}</td></tr>`).join('')}</table></div>`}catch(e){$('au').innerHTML=`<div class="c">${e.message}</div>`}}
loginView();
</script></body></html>
